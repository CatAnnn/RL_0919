status: engineering_assumptions_not_author_configuration
registration_date: '2026-09-20'
selection: fixed_before_training_no_reference_based_search
budget: '1 configuration, 5 fixed seeds, 4 algorithms, 1500 local iterations; smoke tests separate'
assumptions:
  battery: '100 kWh, initial SOC 0.5, bounds [0.1,0.9], charge/discharge efficiency 0.95; not reported in paper'
  soc_equations: 'Discharge: decay-P/(eta_discharge*C); charge: decay-eta_charge*P/C. Correct physical efficiency interpretation; see discrepancy A.'
  soc_projection: 'Project executed battery power to SOC feasible interval before computing costs/loss/reward; not merely clip SOC.'
  weights: 'w_C=w_de=0.5, neutral equal weights chosen before training; no reward rescaling in logs or plots'
  network: 'Separate actor/critic MLP 5-64-64-output, Tanh, orthogonal initialization; actor final gain 0.01, critic final gain 1'
  action_distribution: 'Independent Gaussian latent dimensions with trainable log_std=-0.5; tanh maps to physical intervals; store latent log probabilities whose Jacobian cancels in PPO ratio'
  observation: 'Previous-hour load/wind/PV/SOC/grid price only; hour 1 wraps to Table II hour 24; fixed division by [600,100,100,1,30], no running statistics'
  soc_index: 'SOC in the observation is battery state before current action; cost Eq.8 uses this same pre-action state'
  data: 'All MGs share Table II wind/PV forecasts without capacity scaling; all rows transcribed from PDF images'
  units: 'Preserve Table I/II printed dollar/kW values; use one-hour intervals, no divide-by-1000 price conversion. Quadratic coefficient labels are dimensionally incomplete in original.'
  rollout: 'One 24-step local episode per iteration per MG; full batch 24; terminal bootstrap zero; reset SOC each episode'
  ppo: 'Clip 0.2, 4 actor epochs, 4 critic epochs, normalized GAE advantage, gradient norm cap 0.5, no entropy bonus'
  critic: 'Minimize one-step detached TD squared error Eq.27; fixed targets per update; critic output multiplied by 1000 for conditioning, raw rewards unchanged'
  a2c: 'One unclipped on-policy actor gradient step using same GAE and Adam; 4 critic epochs'
  trpo: 'True Gaussian KL Hessian-vector product, CG 10 steps, damping 0.1, KL bound 0.01, backtracking 10 steps; no actor Adam step'
  federation: 'Mean of all actor/critic parameters including log_std, equal local data volumes; identical initial global model; retain local Adam states; sync frozen old policy on next rollout; discard trajectories'
  boundaries: 'Save pre_fed/post_fed at 500/1000/1500; main schedule 1500 pre_fed; Fig9 500 pre_fed as end of first phase'
  scenario: 'Main training/evaluation deterministic because conclusion contradicts V-A; Gaussian alternative is explicitly supported'
  gaussian: 'Zero mean, SD 15% of each hourly wind/PV forecast and 3% load; independent hour/MG/variable errors; nonnegative truncation; prices fixed'
  trading: 'Same Table II MG seller price; tie order MG1,MG2,MG3; buyers same order; grid absorbs remaining surplus at zero revenue because export tariff unreported'
  reward: 'Eq.16 local reward retained; actual transaction expense separately recorded; Eq.18 not substituted'
  figures: 'Fig5/10 undiscounted episode sum, phase-local trailing mean 25 for display, raw curves retained; Fig9 sum abs(P_de) and daily cost sums'
  evaluation: 'tanh of Gaussian latent mean, same external profile and SOC across checkpoints; not expectation of transformed Gaussian'
  stability: 'Seeds 0-4 preselected; seed0 all main figures; all seeds reported without winner selection; enhancement beyond paper'
  runtime: 'pytorch_env Python/PyTorch current installed versions; CPU one thread for reproducibility; differs from paper Python3.6.8/PyTorch1.7.1'
